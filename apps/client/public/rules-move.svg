<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Move to a glowing square</title>
  <desc id="desc">The selected disciple can move to either of two green legal destination squares. One destination captures an opposing disciple.</desc>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#f4ecdf" stroke-opacity=".045"/></pattern><filter id="shadow"><feDropShadow dx="7" dy="8" stdDeviation="4" flood-opacity=".4"/></filter></defs>
  <rect width="720" height="420" fill="#0b0a0a"/><rect width="720" height="420" fill="url(#grid)"/>
  <text x="28" y="37" fill="#75f6af" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">LEGAL MOVES GLOW GREEN</text>
  <g transform="translate(54 70)" filter="url(#shadow)">
    <rect x="-12" y="-12" width="292" height="292" rx="6" fill="#211617" stroke="#d69a45" stroke-width="2"/>
    <g fill="#5c5045" stroke="#241c1a" stroke-width="4">
      <rect width="52" height="52"/><rect x="54" width="52" height="52" fill="#493b35"/><rect x="108" width="52" height="52"/><rect x="162" width="52" height="52" fill="#493b35"/><rect x="216" width="52" height="52"/>
      <rect y="54" width="52" height="52" fill="#493b35"/><rect x="54" y="54" width="52" height="52"/><rect x="108" y="54" width="52" height="52" fill="#493b35"/><rect x="162" y="54" width="52" height="52"/><rect x="216" y="54" width="52" height="52" fill="#493b35"/>
      <rect y="108" width="52" height="52"/><rect x="54" y="108" width="52" height="52" fill="#493b35"/><rect x="108" y="108" width="52" height="52"/><rect x="162" y="108" width="52" height="52" fill="#493b35"/><rect x="216" y="108" width="52" height="52"/>
      <rect y="162" width="52" height="52" fill="#493b35"/><rect x="54" y="162" width="52" height="52"/><rect x="108" y="162" width="52" height="52" fill="#493b35"/><rect x="162" y="162" width="52" height="52"/><rect x="216" y="162" width="52" height="52" fill="#493b35"/>
      <rect y="216" width="52" height="52"/><rect x="54" y="216" width="52" height="52" fill="#493b35"/><rect x="108" y="216" width="52" height="52"/><rect x="162" y="216" width="52" height="52" fill="#493b35"/><rect x="216" y="216" width="52" height="52"/>
    </g>
    <rect x="56" y="56" width="48" height="48" rx="5" fill="#75f6af" opacity=".46" stroke="#75f6af" stroke-width="3"/>
    <rect x="56" y="164" width="48" height="48" rx="5" fill="#75f6af" opacity=".46" stroke="#75f6af" stroke-width="3"/>
    <circle cx="80" cy="242" r="14" fill="#8f2f3e"/><circle cx="80" cy="242" r="22" fill="none" stroke="#ffb746" stroke-width="4"/>
    <circle cx="80" cy="80" r="14" fill="#315a82"/>
    <path d="M80 218C60 179 60 137 80 106" fill="none" stroke="#ffb746" stroke-width="4" stroke-dasharray="8 7"/><path d="M72 116l8-12 8 12" fill="none" stroke="#ffb746" stroke-width="4"/>
  </g>
  <g transform="translate(387 89)">
    <circle cx="18" cy="18" r="18" fill="#75f6af"/><text x="18" y="24" text-anchor="middle" fill="#102018" font-family="Arial" font-size="18" font-weight="900">3</text>
    <text x="50" y="23" fill="#f4ecdf" font-family="Arial" font-size="21" font-weight="800">Tap a glowing square</text>
    <text x="50" y="51" fill="#bdb3a5" font-family="Arial" font-size="15">Only legal destinations light up.</text>
    <rect y="86" width="290" height="88" rx="5" fill="#201718" stroke="#f13d47"/>
    <circle cx="35" cy="130" r="15" fill="#315a82"/><path d="M73 130h55" stroke="#ffb746" stroke-width="4"/><path d="M118 121l12 9-12 9" fill="none" stroke="#ffb746" stroke-width="4"/>
    <circle cx="165" cy="130" r="15" fill="#8f2f3e"/><path d="M154 119l22 22m0-22l-22 22" stroke="#f4ecdf" stroke-width="3"/>
    <text x="197" y="125" fill="#f4ecdf" font-family="Arial" font-size="15" font-weight="800">LAND TO CAPTURE</text><text x="197" y="147" fill="#bdb3a5" font-family="Arial" font-size="13">Enemy piece leaves the board.</text>
    <text y="216" fill="#ffb746" font-family="Arial" font-size="14" font-weight="800">YOU MAY NEVER LAND ON YOUR OWN PIECE.</text>
  </g>
</svg>
