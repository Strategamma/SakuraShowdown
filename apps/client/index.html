<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakura Showdown</title>
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path
                d="M32 6c3 8-1 14-6 18 7 0 13 3 16 9 2-7 8-10 15-10-5-4-8-10-6-17-6 4-13 4-19 0z"
                fill="#f7c1c6"
              />
              <path
                d="M12 30c8 2 12 8 12 15 4-6 10-9 17-8-5-5-7-12-4-19-6 5-15 6-25 12z"
                fill="#f4a4ad"
              />
              <path
                d="M52 32c-8 2-12 8-12 15-4-6-10-9-17-8 5-5 7-12 4-19 6 5 15 6 25 12z"
                fill="#f0a0a9"
              />
              <circle cx="32" cy="32" r="4.5" fill="#c84b58" />
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-title">Sakura Showdown</div>
            <div class="brand-subtitle">Petal duels. Razor tactics.</div>
          </div>
        </div>
        <div class="status-pill">
          <span class="status-dot"></span>
          <div class="status" id="status">Ready</div>
        </div>
      </header>
      <main id="game-area">
        <aside id="left-panel" class="hand-panel">
          <div class="card-group">
            <div class="group-label">Opponent Hand</div>
            <div id="opponent-hand" class="cards vertical"></div>
          </div>
        </aside>

        <div id="canvas-container"></div>

        <aside id="right-panel">
          <div class="panel-section">
            <label class="label">Match Mode</label>
            <select id="mode">
              <option value="local" selected>Local</option>
              <option value="online">Online</option>
            </select>
            <button id="restart-local" class="ghost-button local-only">Restart Local Match</button>
            <button id="quick-online" class="ghost-button online-only">Quick Online Match</button>
            <div class="local-only local-name-block">
              <label class="label">Player Name</label>
              <input id="local-name" type="text" placeholder="Your name" />
            </div>
          </div>
          <div class="panel-section online-only">
            <label class="label">Room Code</label>
            <div class="room-row">
              <input id="room" type="text" placeholder="Leave blank to host" />
              <button id="copy-room" class="ghost-button">Copy</button>
            </div>
            <button id="connect">Go Online</button>
            <div id="room-info" class="room-info">Not connected</div>
          </div>
          <div class="panel-section">
            <label class="label">You</label>
            <div id="player-label">-</div>
          </div>
          <div class="panel-section">
            <label class="label">Your Hand</label>
            <div id="hand" class="cards"></div>
          </div>
          <div class="panel-section">
            <label class="label">Pool</label>
            <div id="pool" class="cards"></div>
          </div>
          <div class="panel-section">
            <label class="label">Customize</label>
            <button id="customize-cards">Customize Cards</button>
          </div>
        </aside>
      </main>
    </div>
    <div id="customize-overlay" class="overlay hidden">
      <div class="overlay-card">
        <header class="overlay-header">
          <div>
            <div class="overlay-title">Customize Cards</div>
            <div class="overlay-subtitle">Edit names and moves. Changes are local to this browser.</div>
          </div>
          <button id="customize-close" class="ghost-button">Close</button>
        </header>
        <div class="overlay-body">
          <div class="overlay-list" id="card-list"></div>
          <div class="overlay-editor">
            <div class="editor-title">Card Details</div>
            <label class="label">Name</label>
            <input id="card-name" type="text" placeholder="Card name" />
            <label class="label">Moves (x,y)</label>
            <div id="move-list" class="move-list"></div>
            <div class="move-controls">
              <input id="move-x" type="number" placeholder="x" />
              <input id="move-y" type="number" placeholder="y" />
              <button id="move-add" class="ghost-button">Add Move</button>
            </div>
            <div class="editor-actions">
              <button id="card-add">Add Card</button>
              <button id="card-remove" class="ghost-button">Remove Card</button>
            </div>
          </div>
        </div>
        <footer class="overlay-footer">
          <button id="cards-reset" class="ghost-button">Reset</button>
          <button id="cards-export" class="ghost-button">Export JSON</button>
          <button id="cards-apply">Apply Changes</button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
