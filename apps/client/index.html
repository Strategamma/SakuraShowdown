<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Onitama-like</title>
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <div class="brand">Onitama-like</div>
        <div class="status" id="status">Ready</div>
      </header>
      <main id="game-area">
        <div id="canvas-container"></div>
        <div id="side-panel">
          <div class="panel-section">
            <label class="label">Mode</label>
            <select id="mode">
              <option value="local" selected>Local</option>
              <option value="online" disabled>Online (coming soon)</option>
            </select>
          </div>
          <div class="panel-section">
            <label class="label">Room</label>
            <input id="room" type="text" placeholder="Room ID (optional)" />
            <button id="connect">Connect</button>
          </div>
          <div class="panel-section">
            <label class="label">You</label>
            <div id="player-label">-</div>
          </div>
          <div class="panel-section">
            <label class="label">Customize</label>
            <button id="customize-cards">Customize Cards</button>
          </div>
        </div>
      </main>
      <footer id="card-bar">
        <div class="card-group">
          <div class="group-label">Your Hand</div>
          <div id="hand" class="cards"></div>
        </div>
        <div class="card-group">
          <div class="group-label">Pool</div>
          <div id="pool" class="cards"></div>
        </div>
      </footer>
    </div>
    <div id="customize-overlay" class="overlay hidden">
      <div class="overlay-card">
        <header class="overlay-header">
          <div>
            <div class="overlay-title">Customize Cards</div>
            <div class="overlay-subtitle">Edit names and moves. Changes are local to this browser.</div>
          </div>
          <button id="customize-close" class="ghost-button">Close</button>
        </header>
        <div class="overlay-body">
          <div class="overlay-list" id="card-list"></div>
          <div class="overlay-editor">
            <div class="editor-title">Card Details</div>
            <label class="label">Name</label>
            <input id="card-name" type="text" placeholder="Card name" />
            <label class="label">Moves (x,y)</label>
            <div id="move-list" class="move-list"></div>
            <div class="move-controls">
              <input id="move-x" type="number" placeholder="x" />
              <input id="move-y" type="number" placeholder="y" />
              <button id="move-add" class="ghost-button">Add Move</button>
            </div>
            <div class="editor-actions">
              <button id="card-add">Add Card</button>
              <button id="card-remove" class="ghost-button">Remove Card</button>
            </div>
          </div>
        </div>
        <footer class="overlay-footer">
          <button id="cards-reset" class="ghost-button">Reset</button>
          <button id="cards-export" class="ghost-button">Export JSON</button>
          <button id="cards-apply">Apply Changes</button>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
