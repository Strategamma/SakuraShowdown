<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakura Showdown</title>
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <rect x="10" y="14" width="44" height="6" rx="3" fill="#f7c1c6" />
            <rect x="18" y="20" width="28" height="6" rx="3" fill="#f0a0a9" />
            <rect x="16" y="26" width="6" height="26" rx="3" fill="#f4a4ad" />
            <rect x="42" y="26" width="6" height="26" rx="3" fill="#f4a4ad" />
            <rect x="12" y="50" width="40" height="6" rx="3" fill="#c84b58" />
            <circle cx="32" cy="40" r="4" fill="#fbe1e6" />
          </svg>
        </div>
        <div class="brand-text centered">
          <div class="brand-title">Sakura Showdown</div>
          <div class="brand-subtitle">Petal duels. Razor tactics.</div>
        </div>
        <div class="toolbar">
          <div id="match-controls" class="match-controls">
            <label class="label">Mode</label>
            <select id="mode">
              <option value="local" selected>Local</option>
              <option value="online">Online</option>
            </select>
            <button id="restart-local" class="ghost-button local-only">Start Match</button>
            <button id="quick-online" class="ghost-button online-only">Quick Online Match</button>
            <div class="room-row online-only">
              <input id="room" type="text" placeholder="Room code" />
              <button id="connect">Go Online</button>
              <button id="copy-room" class="ghost-button">Copy</button>
            </div>
            <div id="room-info" class="room-info online-only">Not connected</div>
          </div>
          <button id="open-customize" class="ghost-button">Customize</button>
          <button id="toggle-view" class="ghost-button">2D View</button>
          <div class="status-pill">
            <span class="status-dot"></span>
            <div class="status" id="status">Ready</div>
          </div>
        </div>
      </header>
      <main id="game-area">
        <aside id="card-house">
          <div class="card-house-section" id="opponent-section">
            <div class="player-name" id="opponent-name">Opponent</div>
            <div class="captured-row" id="opponent-captured"></div>
            <div id="opponent-hand" class="cards vertical"></div>
          </div>
          <div class="card-house-section" id="pool-section">
            <label class="label">Pool</label>
            <div id="pool" class="cards vertical"></div>
          </div>
          <div class="card-house-section" id="player-section">
            <div class="player-name" id="player-name">You</div>
            <div class="captured-row" id="player-captured"></div>
            <div id="hand" class="cards vertical"></div>
          </div>
        </aside>

        <div id="canvas-container"></div>

        <aside id="right-panel">
          <div class="panel-section">
            <label class="label">Names</label>
            <div class="local-name-block">
              <label class="label">Player Name</label>
              <input id="local-name" type="text" placeholder="Your name" />
              <label class="label">Opponent Name</label>
              <input id="local-opponent-name" type="text" placeholder="Opponent name" />
              <label class="label">Starting Player</label>
              <select id="starting-player">
                <option value="random" selected>Random</option>
                <option value="p1">Player 1</option>
                <option value="p2">Player 2</option>
              </select>
            </div>
          </div>
          <div class="panel-section">
            <label class="label">You</label>
            <div id="player-label">-</div>
          </div>
          <div class="panel-section">
            <label class="label">Customize</label>
            <button id="customize-cards">Customize Cards</button>
          </div>
        </aside>
      </main>
    </div>
    <div id="customize-overlay" class="overlay hidden">
      <div class="overlay-card">
        <header class="overlay-header">
          <div>
            <div class="overlay-title">Customize Cards</div>
            <div class="overlay-subtitle">Edit names and moves. Changes are local to this browser.</div>
          </div>
          <button id="customize-close" class="ghost-button">Close</button>
        </header>
        <div class="overlay-body">
          <div class="overlay-list" id="card-list"></div>
          <div class="overlay-editor">
            <div class="editor-title">Card Details</div>
            <label class="label">Name</label>
            <input id="card-name" type="text" placeholder="Card name" />
            <label class="label">Move Grid (5x5)</label>
            <div id="card-grid" class="card-grid"></div>
            <label class="label">Moves (x,y)</label>
            <div id="move-list" class="move-list"></div>
            <div class="move-controls">
              <input id="move-x" type="number" placeholder="x" />
              <input id="move-y" type="number" placeholder="y" />
              <button id="move-add" class="ghost-button">Add Move</button>
            </div>
            <div class="editor-actions">
              <button id="card-add">Add Card</button>
              <button id="card-remove" class="ghost-button">Remove Card</button>
            </div>
          </div>
        </div>
        <footer class="overlay-footer">
          <button id="cards-reset" class="ghost-button">Reset</button>
          <button id="cards-export" class="ghost-button">Export JSON</button>
          <button id="cards-apply">Apply Changes</button>
        </footer>
      </div>
    </div>
    <div id="victory-overlay" class="overlay hidden">
      <div class="overlay-card victory-card">
        <header class="overlay-header">
          <div>
            <div class="overlay-title" id="victory-title">Victory!</div>
            <div class="overlay-subtitle" id="victory-subtitle">Well played.</div>
          </div>
          <button id="victory-close" class="ghost-button">Close</button>
        </header>
        <div class="overlay-body victory-body">
          <div class="victory-actions">
            <button id="victory-random">Start Random 5</button>
            <button id="victory-choose" class="ghost-button">Choose 5 Cards</button>
          </div>
        </div>
      </div>
    </div>
    <div id="draft-overlay" class="overlay hidden">
      <div class="overlay-card draft-card">
        <header class="overlay-header">
          <div>
            <div class="overlay-title">Select 5 Cards</div>
            <div class="overlay-subtitle">Pick any five cards for the next match.</div>
          </div>
          <button id="draft-close" class="ghost-button">Close</button>
        </header>
        <div class="overlay-body">
          <div class="draft-grid" id="draft-grid"></div>
          <div class="draft-footer">
            <div class="draft-count" id="draft-count">0 / 5 selected</div>
            <button id="draft-start">Start Match</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
